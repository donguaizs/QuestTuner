# Toolchain (downloaded to workspace)
org.gradle.java.home=F:/workspace/toolchain/jdk-extract/jdk-17.0.20.1+1

# Performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin compiler daemon: keep alive files inside workspace (TEMP ACL issue)
kotlin.daemon.jvmargs=-Djava.io.tmpdir=F:/workspace/toolchain/ktmp -Xmx1536m
kotlin.compiler.execution.strategy=in-process

# Non-transitive R classes
android.nonTransitiveRClass=true
android.useAndroidX=true
